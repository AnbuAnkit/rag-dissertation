[project]
name = "rag-dissertation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ankit", email = "ankitmahto87@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "deepeval>=4.3.1",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.3",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "pandas>=3.0.6",
    "pypdf>=6.21.2",
    "sentence-transformers>=6.2.0",
    "torch==2.14.1",
    "torchvision==0.29.1",
]

[project.scripts]
rag-dissertation = "rag_dissertation:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
